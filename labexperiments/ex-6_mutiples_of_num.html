<!doctype html>
<html>
    <body>
        <center>
        <script type="text/javascript">
            var num=prompt("enter the number:");
            var loop=1;
            while(loop<=200)
        {
             if(loop%num==0)
             {
                document.write(loop+" ");
             }
             loop++;
        }
            
        </script>
        </center>
    </body>
</html>
