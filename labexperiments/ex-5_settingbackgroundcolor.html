<!DOCTYPE html>
<html>
<head>
    <title>Setting Background Color</title>
    <script>
        var today = new Date();
        var minutes = today.getMinutes();

        if (minutes >= 0 && minutes <= 20)
            document.write("<body text='white' bgcolor='blue'>");
        else
            document.write("<body text='white' bgcolor='black'>");
    </script>
</head>
</html>
