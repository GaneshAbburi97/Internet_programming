<!doctype html>
<html>
    <title> Factorial of n numbers</title>
    
    <head>
        <h1>Factorial of n numbers </h1>
    </head>
    <body>
        <script type="text/javascript">
            var fact=1,i,n;
            n=prompt("enter the number:");
            for(i=1;i<n;i++)
        {
            fact=fact*i;
        }
        document.write("factorial of "+n+" is "+fact);
        </script>
    </body>
</html>
