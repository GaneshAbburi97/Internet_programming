<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Experiment 1 - Responsive Layout</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f2f2f2;
}

header{
    background:#2c3e50;
    color:white;
    padding:20px;
    text-align:center;
}

nav{
    display:flex;
    justify-content:center;
    background:#34495e;
}

nav a{
    color:white;
    padding:15px;
    text-decoration:none;
}

nav a:hover{
    background:#1abc9c;
}

.container{
    display:flex;
    gap:20px;
    padding:20px;
}

.sidebar{
    flex:1;
    background:white;
    padding:20px;
}

.content{
    flex:3;
    background:white;
    padding:20px;
}

footer{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:15px;
}

@media(max-width:768px){
.container{
flex-direction:column;
}

nav{
flex-wrap:wrap;
}
}

@media(max-width:480px){

nav{
flex-direction:column;
}

}
</style>

</head>

<body>

<header>
<h1>Retail Website</h1>
</header>

<nav>
<a href="#">Home</a>
<a href="#">Products</a>
<a href="#">Offers</a>
<a href="#">Contact</a>
</nav>

<div class="container">

<div class="sidebar">
<h3>Categories</h3>
<p>Electronics</p>
<p>Fashion</p>
<p>Furniture</p>
</div>

<div class="content">
<h2>Responsive Layout</h2>
<p>This webpage automatically adjusts for desktop, tablet, and mobile devices using Flexbox and Media Queries.</p>
</div>

</div>

<footer>
<p>© 2026 Responsive Website</p>
</footer>

</body>
</html>
